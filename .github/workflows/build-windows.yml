name: Build Windows apps

# Builds the two apps into real Windows executables on a Windows machine,
# then uploads them as downloadable artifacts. No Python needed to run them.
#
# When it runs:
#   * every push to main
#   * on every pull request (so you can download and test before merging)
#   * on demand   (Actions tab -> this workflow -> "Run workflow")
#   * on a version tag like v1.0.0  (also publishes a GitHub Release)
#
# Where to get the files:
#   Open a run in the Actions tab -> "Artifacts" at the bottom:
#     DesktopCompanion-windows   <- the pet app (DesktopCompanion.exe inside)
#     MonitorBot-windows         <- the Telegram bot

on:
  push:
    branches: [main]
    tags: ["v*"]        # a v1.0.0-style tag also publishes a Release
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a Release at this tag (e.g. v1.0.0). Leave blank to only build."
        required: false
        default: ""

# Least privilege by default: the build job only reads the repo. Only the
# release job (below) is granted write access, and only for version tags.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # the build runs code; don't leave a token around

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Generate image assets (icons, tiles, splash)
        run: python packaging/generate_assets.py

      - name: Build Desktop Companion (the pet app)
        run: pyinstaller --noconfirm --clean packaging/DesktopCompanion.spec

      - name: Build Monitor Bot (the Telegram bot)
        run: pyinstaller --noconfirm --clean packaging/MonitorBot.spec

      # Wrap the Desktop Companion build in a one-click installer. Inno Setup
      # (iscc) is pre-installed on the GitHub windows-latest runner.
      - name: Build the installer (Inno Setup)
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup (ISCC) not found on the runner." }
          # Derive the version from a pushed tag, or a manual release_tag, else 1.0.0.
          $ver = "1.0.0"
          if ($env:GITHUB_REF -like "refs/tags/v*") { $ver = $env:GITHUB_REF.Substring(11) }
          elseif ($env:RELEASE_TAG -like "v*") { $ver = $env:RELEASE_TAG.Substring(1) }
          & $iscc "/DMyAppVersion=$ver" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed (exit $LASTEXITCODE)." }

      # The installer: one file to download and run. This is the main download.
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: DesktopCompanion-Setup
          path: DesktopCompanion-Setup.exe

      # The raw app folders too, for anyone who prefers an unzip-and-run copy.
      # upload-artifact zips what you give it, so passing the folder (not a .zip)
      # means one extraction to reach the exe.
      - name: Upload Desktop Companion (portable)
        uses: actions/upload-artifact@v4
        with:
          name: DesktopCompanion-windows
          path: dist/DesktopCompanion

      - name: Upload Monitor Bot (portable)
        uses: actions/upload-artifact@v4
        with:
          name: MonitorBot-windows
          path: dist/MonitorBot

  # Publishing is isolated in its own job: it alone gets write access. It runs
  # for a pushed version tag, or a maintainer-triggered "Run workflow" with a
  # release_tag input (only users with write access can dispatch a workflow).
  # A plain PR or build-only run never publishes.
  release:
    needs: build
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.release_tag, 'v'))
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download the installer
        uses: actions/download-artifact@v4
        with:
          name: DesktopCompanion-Setup
          path: setup

      - name: Download built Desktop Companion
        uses: actions/download-artifact@v4
        with:
          name: DesktopCompanion-windows
          path: DesktopCompanion

      - name: Download built Monitor Bot
        uses: actions/download-artifact@v4
        with:
          name: MonitorBot-windows
          path: MonitorBot

      - name: Zip the portable apps for the Release
        shell: pwsh
        run: |
          Compress-Archive -Path DesktopCompanion -DestinationPath DesktopCompanion-windows.zip -Force
          Compress-Archive -Path MonitorBot      -DestinationPath MonitorBot-windows.zip -Force

      - name: Publish the Release
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push this is the ref; on a manual run it's the input, and
          # the tag is created at this commit if it doesn't exist yet.
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            ## Install Desktop Companion

            **Easiest:** download **`DesktopCompanion-Setup.exe`** below, run it,
            and click through the installer. It adds a Start-menu entry (and an
            optional desktop shortcut) and installs just for you — no admin needed.

            Windows SmartScreen may warn that the publisher is unknown (the app
            isn't code-signed yet): click **More info → Run anyway**.

            Prefer no installer? Grab **`DesktopCompanion-windows.zip`**, unzip it,
            and run `DesktopCompanion.exe`.

            `MonitorBot-windows.zip` is the optional Telegram bot — see the README.
          files: |
            setup/DesktopCompanion-Setup.exe
            DesktopCompanion-windows.zip
            MonitorBot-windows.zip
