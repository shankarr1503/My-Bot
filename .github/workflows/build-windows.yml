name: Build Windows apps

# Builds the two apps into real Windows executables on a Windows machine,
# then uploads them as downloadable artifacts. No Python needed to run them.
#
# When it runs:
#   * every push to main
#   * on every pull request (so you can download and test before merging)
#   * on demand   (Actions tab -> this workflow -> "Run workflow")
#   * on a version tag like v1.0.0  (also publishes a GitHub Release)
#
# Where to get the files:
#   Open a run in the Actions tab -> "Artifacts" at the bottom:
#     DesktopCompanion-windows   <- the pet app (DesktopCompanion.exe inside)
#     MonitorBot-windows         <- the Telegram bot

on:
  push:
    branches: [main]
    tags: ["v*"]        # a v1.0.0-style tag also publishes a Release
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a Release at this tag (e.g. v1.0.0). Leave blank to only build."
        required: false
        default: ""

# Least privilege by default: the build job only reads the repo. Only the
# release job (below) is granted write access, and only for version tags.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # the build runs code; don't leave a token around

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Generate image assets (icons, tiles, splash)
        run: python packaging/generate_assets.py

      - name: Build Desktop Companion (the pet app)
        run: pyinstaller --noconfirm --clean packaging/DesktopCompanion.spec

      # The Monitor Bot Dashboard: one windowed app that is the control panel
      # AND the bot (it runs itself with --bot). Replaces the console-only build.
      - name: Build Monitor Bot Dashboard (GUI + bot)
        run: pyinstaller --noconfirm --clean packaging/MonitorBotDashboard.spec

      # Code-signing (OFF by default). To turn it on, set the repository
      # variable SIGN_BINARIES to "true" and add the certificate secret
      # SIGNING_PFX_BASE64 (and SIGNING_PFX_PASSWORD if the .pfx has one).
      # See packaging/CODE-SIGNING.md for the full guide, including the drop-in
      # replacement for an Azure Artifact Signing or EV cloud-HSM certificate.
      # We sign the app .exe files here, BEFORE packaging, so the installed app
      # is signed; the installers themselves are signed after Inno Setup below.
      - name: Sign the app executables
        if: vars.SIGN_BINARIES == 'true'
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
          SIGNING_TIMESTAMP_URL: ${{ vars.SIGNING_TIMESTAMP_URL }}
        run: >-
          pwsh packaging/sign-windows.ps1
          dist/DesktopCompanion/DesktopCompanion.exe
          dist/MonitorBotDashboard/MonitorBotDashboard.exe

      # Wrap each build in a one-click installer. Inno Setup (iscc) is
      # pre-installed on the GitHub windows-latest runner.
      - name: Build the installers (Inno Setup)
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup (ISCC) not found on the runner." }
          # Derive the version from a pushed tag, or a manual release_tag, else 1.0.0.
          $ver = "1.0.0"
          if ($env:GITHUB_REF -like "refs/tags/v*") { $ver = $env:GITHUB_REF.Substring(11) }
          elseif ($env:RELEASE_TAG -like "v*") { $ver = $env:RELEASE_TAG.Substring(1) }
          & $iscc "/DMyAppVersion=$ver" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup (companion) failed (exit $LASTEXITCODE)." }
          & $iscc "/DMyAppVersion=$ver" packaging\installer_dashboard.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup (dashboard) failed (exit $LASTEXITCODE)." }

      # Sign the installers themselves. This is the signature Windows SmartScreen
      # and Chrome check when the file is downloaded, so it is what removes the
      # "unknown publisher" warning. OFF unless SIGN_BINARIES=true (see above).
      - name: Sign the installers
        if: vars.SIGN_BINARIES == 'true'
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
          SIGNING_TIMESTAMP_URL: ${{ vars.SIGNING_TIMESTAMP_URL }}
        run: >-
          pwsh packaging/sign-windows.ps1
          DesktopCompanion-Setup.exe
          MonitorBotDashboard-Setup.exe

      # The installers: one file each to download and run. These are the main downloads.
      - name: Upload the Desktop Companion installer
        uses: actions/upload-artifact@v4
        with:
          name: DesktopCompanion-Setup
          path: DesktopCompanion-Setup.exe

      - name: Upload the Dashboard installer
        uses: actions/upload-artifact@v4
        with:
          name: MonitorBotDashboard-Setup
          path: MonitorBotDashboard-Setup.exe

      # The raw app folders too, for anyone who prefers an unzip-and-run copy.
      # upload-artifact zips what you give it, so passing the folder (not a .zip)
      # means one extraction to reach the exe.
      - name: Upload Desktop Companion (portable)
        uses: actions/upload-artifact@v4
        with:
          name: DesktopCompanion-windows
          path: dist/DesktopCompanion

      - name: Upload Monitor Bot Dashboard (portable)
        uses: actions/upload-artifact@v4
        with:
          name: MonitorBotDashboard-windows
          path: dist/MonitorBotDashboard

  # Publishing is isolated in its own job: it alone gets write access. It runs
  # for a pushed version tag, or a maintainer-triggered "Run workflow" with a
  # release_tag input (only users with write access can dispatch a workflow).
  # A plain PR or build-only run never publishes.
  release:
    needs: build
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.release_tag, 'v'))
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download the Desktop Companion installer
        uses: actions/download-artifact@v4
        with:
          name: DesktopCompanion-Setup
          path: setup-companion

      - name: Download the Dashboard installer
        uses: actions/download-artifact@v4
        with:
          name: MonitorBotDashboard-Setup
          path: setup-dashboard

      - name: Download built Desktop Companion
        uses: actions/download-artifact@v4
        with:
          name: DesktopCompanion-windows
          path: DesktopCompanion

      - name: Download built Monitor Bot Dashboard
        uses: actions/download-artifact@v4
        with:
          name: MonitorBotDashboard-windows
          path: MonitorBotDashboard

      - name: Zip the portable apps for the Release
        shell: pwsh
        run: |
          Compress-Archive -Path DesktopCompanion     -DestinationPath DesktopCompanion-windows.zip -Force
          Compress-Archive -Path MonitorBotDashboard   -DestinationPath MonitorBotDashboard-windows.zip -Force

      - name: Publish the Release
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push this is the ref; on a manual run it's the input, and
          # the tag is created at this commit if it doesn't exist yet.
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            ## Downloads

            **Desktop Companion** (the friendly desktop pet):
            download **`DesktopCompanion-Setup.exe`**, run it, click through the
            installer. Per-user, no admin needed.

            **Monitor Bot Dashboard** (control your laptop from Telegram):
            download **`MonitorBotDashboard-Setup.exe`**, install it, open the
            Dashboard, paste your bot token on the Connect tab, link your account,
            and press Start. Per-user, no admin needed.

            ${{ vars.SIGN_BINARIES == 'true' && 'These apps are digitally signed by a verified publisher, so Windows should install them without a SmartScreen publisher warning.' || 'Windows SmartScreen may warn that the publisher is unknown, because these apps are not code-signed yet: click **More info -> Run anyway**. In Chrome, if it says the file is not commonly downloaded, choose **Keep**.' }}

            Prefer no installer? The matching `*-windows.zip` files are portable:
            unzip and run the `.exe` inside.
          files: |
            setup-companion/DesktopCompanion-Setup.exe
            setup-dashboard/MonitorBotDashboard-Setup.exe
            DesktopCompanion-windows.zip
            MonitorBotDashboard-windows.zip
